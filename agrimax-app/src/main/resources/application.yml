server:
  port: 8080

spring:
  application:
    name: agrimax-backend
  config:
    import: optional:file:.env[.properties]    # Yeh nayi line add karo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Async task executor (for @Async event listeners and @Scheduled cleanup)
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
    scheduling:
      pool:
        size: 2

# ── AgriMax Custom Configuration ──
agrimax:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 86400000     # 24 hours
    refresh-token-expiry-ms: 604800000   # 7 days

  ai:
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: gemini-3.8-flash
      base-url: https://generativelanguage.googleapis.com/v1beta

  voice:
    # Mock mode - accepts text transcripts directly instead of audio
    mock-stt: true

  cors:
    # Comma-separated list of allowed origins — override in prod via env var
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173}